<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/moxie_emblem.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Moxie Infratech Pvt Ltd | EHV Substation Civil & Electrical EPC Contractor</title>
    <meta name="description" content="End-to-end civil construction & electrical turnkey solutions for EHV electrical substations (11kV to 765kV), transmission & distribution, industrial electrification, MEP, and statutory CEIG compliance." />
    <meta name="theme-color" content="#0B0F14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* ── SPLASH SCREEN ── */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0B1120;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        /* fade-out transition triggered by JS */
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                    transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #splash.hide {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }

      /* Logo wrapper — starts small, scales up */
      #splash-logo {
        display: flex;
        align-items: center;
        gap: 1.5rem;
        opacity: 0;
        transform: translateY(20px) scale(0.92);
        animation: splashLogoIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
      }

      @keyframes splashLogoIn {
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      #splash-logo img.emblem {
        width: 110px;
        height: 110px;
        object-fit: contain;
        border-radius: 50%;
        filter: drop-shadow(0 0 32px rgba(26, 115, 200, 0.5));
      }

      #splash-logo img.wordmark {
        height: 90px;
        width: auto;
        object-fit: contain;
        border-radius: 6px;
        filter: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.5));
      }

      /* Thin progress line */
      #splash-bar {
        width: 220px;
        height: 2px;
        background: rgba(255,255,255,0.08);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        animation: splashBarFade 0.4s ease 0.7s forwards;
      }

      @keyframes splashBarFade {
        to { opacity: 1; }
      }

      #splash-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #1A73C8, #38BDF8);
        border-radius: 2px;
        animation: splashBarGrow 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.7s forwards;
      }

      @keyframes splashBarGrow {
        to { width: 100%; }
      }

      /* Tagline */
      #splash-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.25);
        opacity: 0;
        animation: splashTagIn 0.6s ease 1s forwards;
      }

      @keyframes splashTagIn {
        to { opacity: 1; }
      }

      /* Root hidden until splash exits */
      #root {
        opacity: 0;
        transition: opacity 0.6s ease;
      }
      #root.visible {
        opacity: 1;
      }
    </style>
  </head>
  <body>

    <!-- SPLASH SCREEN -->
    <div id="splash">
      <div id="splash-logo">
        <img class="emblem" src="/images/moxie_emblem.png" alt="Moxie Infratech emblem" />
        <img class="wordmark" src="/images/moxie_logo_full.png" alt="Moxie Infratech Pvt Ltd" />
      </div>
      <div id="splash-bar">
        <div id="splash-bar-fill"></div>
      </div>
      <span id="splash-tag">Civil &amp; Electrical EPC · South India</span>
    </div>

    <!-- APP -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Hide splash and reveal app after content loads
      window.addEventListener('load', function () {
        setTimeout(function () {
          var splash = document.getElementById('splash');
          var root = document.getElementById('root');
          if (splash) splash.classList.add('hide');
          if (root) root.classList.add('visible');
          // Remove from DOM after transition completes
          setTimeout(function () {
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
          }, 900);
        }, 1800); // show for 1.8s minimum
      });
    </script>

  </body>
</html>
